<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="查看 PKC 赛季总览、队伍状态、英雄池和对局分析图。">
  <title>PKC 赛季仪表盘</title>
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <style>
    /* Hallmark · shape: app screen · genre: modern-minimal · scope: app · built: the project · redesign: full app screen · v2.0.0
     * pre-emit critique: P4 H4 E4 S5 R4 V4 · weakest: V, dashboard colours now resolve through the shared workbench system.
     */
    :root{--bg:var(--color-canvas);--card:var(--color-surface);--ink:var(--color-ink);--sub:var(--color-muted);--line:var(--color-line);--blue:var(--color-primary);--gold:var(--color-gold);--bad:var(--color-negative);--warn:var(--color-warning);--ok:var(--color-positive)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:clip}body{background:radial-gradient(circle at 8% 0,var(--color-stage-background),transparent 30%),var(--bg);color:var(--ink);font:14px/1.5 var(--font-body)}
    button,select{font:inherit}button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    h1,h2,h3{text-wrap:balance}button:active{transform:translateY(1px)}
    .top{padding:var(--space-5) var(--space-6) var(--space-4);background:linear-gradient(118deg,var(--color-inverse-3),var(--color-inverse-3) 55%,var(--color-inverse-2));color:var(--color-surface)}
    .top-inner{max-width:1680px;margin:auto;display:flex;gap:var(--space-4);align-items:flex-end;flex-wrap:wrap}
    .title{flex:1;min-width:260px}.title h1{margin:var(--space-1) 0 2px;font-size:26px}.title p{margin:0;color:var(--color-white-62)}
    .toolbar{display:flex;gap:var(--space-2);flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);padding:var(--space-2) var(--space-3);font-weight:700;cursor:pointer}.btn:hover{background:var(--color-surface-raised)}.btn.primary{background:var(--color-gold-bright);border-color:var(--color-gold-bright);color:var(--color-on-gold)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .wrap{max-width:1680px;margin:auto;padding:var(--space-4) var(--space-5) var(--space-12)}
    .filters{display:grid;grid-template-columns:minmax(180px,1.3fr) repeat(3,minmax(130px,.7fr)) auto;gap:var(--space-2);align-items:end;padding:var(--space-3);background:var(--card);border:1px solid var(--line);border-radius:14px}
    label{display:flex;flex-direction:column;gap:var(--space-1);color:var(--sub);font-size:11px;font-weight:700}
    select{border:1px solid var(--line);border-radius:8px;background:var(--color-surface-raised);padding:var(--space-2) var(--space-2);color:var(--ink)}
    .status{padding:var(--space-2) var(--space-2);border-radius:9px;background:var(--color-surface-sunken);color:var(--color-primary-dark);font-size:12px;white-space:nowrap}.status.bad{background:var(--color-negative-soft);color:var(--color-negative-2)}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-2);margin:var(--space-3) 0}
    .kpi{padding:var(--space-3) var(--space-3);background:var(--color-surface);border:1px solid var(--line);border-radius:12px}.kpi span{display:block;color:var(--sub);font-size:11px}.kpi b{display:block;margin-top:var(--space-1);font:800 23px/1.1 Bahnschrift,system-ui,sans-serif}
    .notice{padding:var(--space-2) var(--space-3);border-radius:10px;background:var(--color-warning-soft);color:var(--color-on-gold);margin:var(--space-2) 0;font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
    .figure{background:var(--color-surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .figure-head{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-3);border-bottom:1px solid var(--line)}
    .figure-head b{font-size:13px}.figure-head span{margin-left:auto;color:var(--sub);font-size:11px}
    canvas{display:block;width:100%;height:auto;background:var(--color-ink-strong)}
    .poster{grid-column:1/-1}.poster .canvas-wrap{max-width:540px;margin:auto}.poster canvas{width:100%}
    .hint{color:var(--sub);font-size:11px;margin-top:var(--space-2)}
    @media(max-width:1100px){.filters{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
    @media(max-width:620px){.top{padding:var(--space-4)}.wrap{padding:var(--space-3)}.filters{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title"><h1>完整赛季仪表盘</h1><p>当前系列赛、官方赛果与有效对局统一口径</p></div>
      <div class="toolbar">
        <button class="btn primary" id="btnSeasonZip">打包下载全部 6 张</button>
        <button class="btn" id="btnSeasonText">复制文字摘要</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="filters">
      <label>系列赛<select id="seasonSeries"></select></label>
      <label>阶段<select id="seasonStage"><option value="all">全部阶段</option><option value="group">小组赛</option><option value="knockout">淘汰赛</option></select></label>
      <label>对比左队<select id="seasonLeft"></select></label>
      <label>对比右队<select id="seasonRight"></select></label>
      <button class="btn primary" id="btnSeasonRefresh">刷新仪表盘</button>
    </section>
    <div class="status" id="seasonStatus" role="status" aria-live="polite">正在读取赛季数据…</div>
    <section class="summary" id="seasonSummary"></section>
    <div class="notice" id="seasonWarnings" hidden></div>
    <section class="grid">
      <article class="figure"><div class="figure-head"><b>01 · 赛季总览</b><span>1920 × 1080</span><button class="btn" data-download="overview">下载</button></div><canvas id="seasonOverview" width="1920" height="1080" role="img" aria-label="赛季总览图"></canvas></article>
      <article class="figure"><div class="figure-head"><b>02 · 队伍状态</b><span>1920 × 1080</span><button class="btn" data-download="teams">下载</button></div><canvas id="seasonTeams" width="1920" height="1080" role="img" aria-label="队伍状态图"></canvas></article>
      <article class="figure"><div class="figure-head"><b>03 · 双方对比</b><span>1920 × 1080</span><button class="btn" data-download="compare">下载</button></div><canvas id="seasonCompare" width="1920" height="1080" role="img" aria-label="双方对比图"></canvas></article>
      <article class="figure"><div class="figure-head"><b>04 · 队伍英雄池</b><span>1920 × 1080</span><button class="btn" data-download="players">下载</button></div><canvas id="seasonPlayers" width="1920" height="1080" role="img" aria-label="队伍英雄池图"></canvas></article>
      <article class="figure"><div class="figure-head"><b>05 · BP 与英雄热度</b><span>1920 × 1080</span><button class="btn" data-download="heroes">下载</button></div><canvas id="seasonHeroes" width="1920" height="1080" role="img" aria-label="BP 与英雄热度图"></canvas></article>
      <article class="figure poster"><div class="figure-head"><b>赛季总结海报</b><span>1080 × 1350 · 4:5</span><button class="btn" data-download="poster">下载</button></div><div class="canvas-wrap"><canvas id="seasonPoster" width="1080" height="1350" role="img" aria-label="赛季总结海报"></canvas></div></article>
    </section>
    <div class="hint">统计口径：弃权和判负计入官方胜负，但不进入英雄、选手和对局指标分母；零样本显示 N/A，不补零。</div>
  </main>
  <script src="/assets/pkc-season.js"></script>
</body>
</html>
