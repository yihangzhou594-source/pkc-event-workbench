<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="制作 PKC 赛前宣传图与选手轮播画面。">
<title>赛前宣传图 · PKC 赛事工作台</title>
<link rel="stylesheet" href="/assets/design-tokens.css">
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · scope: app · built: the project · redesign: full app screen · v2.0.0
 * pre-emit critique: P4 H4 E4 S5 R4 V4 · weakest: V, the poster editor now shares the workbench control system.
 */
  :root{--bg:var(--color-surface-sunken);--card:var(--color-surface);--ink:var(--color-ink);--sub:var(--color-muted);--line:var(--color-line);--blue:var(--color-primary);--gold:var(--color-gold);--shadow:var(--shadow-soft)}
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body)}
  h1,h2,h3{text-wrap:balance}
  button:active{transform:translateY(1px)}
  .wrap{padding:var(--space-4) var(--space-5) var(--space-9);max-width:1500px;margin:0 auto}
  h1{margin:0;font-size:24px}
  .sub{color:var(--sub);margin-top:var(--space-1)}
  .layout{display:grid;grid-template-columns:420px minmax(0,1fr);gap:var(--space-4);margin-top:var(--space-4)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:var(--space-4)}
  .form h3{margin:0 0 var(--space-3);font-size:15px}
  .row{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-2) 0}
  .row label{width:58px;flex:0 0 58px;color:var(--sub);font-size:12px}
  .row input,.row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:var(--space-2) var(--space-2);font:inherit;background:var(--color-surface)}
  .team-box{border:1px solid var(--line);border-radius:12px;padding:var(--space-2);margin-top:var(--space-2)}
  .team-box h4{margin:0 0 var(--space-2);font-size:13px}
  .optional-sub{margin-top:var(--space-2)}
  .optional-sub>summary,.optional-section>summary{cursor:pointer;color:var(--sub);font-size:12px;font-weight:700;padding:var(--space-2) var(--space-2);border:1px dashed var(--line);border-radius:8px;background:var(--color-surface-raised)}
  .optional-sub[open]>summary,.optional-section[open]>summary{margin-bottom:var(--space-1)}
  .optional-section{margin-top:var(--space-4)}
  .optional-content{padding:var(--space-1) 2px}
  .caster-box{border:1px solid var(--line);border-radius:11px;padding:var(--space-2);margin-top:var(--space-2);background:linear-gradient(180deg,var(--color-surface),var(--color-surface-raised))}
  .caster-box>b{display:block;font-size:12px;color:var(--sub);margin-bottom:var(--space-1)}
  .caster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-1)}
  .caster-grid input{min-width:0;border:1px solid var(--line);border-radius:7px;padding:var(--space-2);font:inherit}
  .player{display:flex;gap:var(--space-1);margin:var(--space-1) 0;align-items:center}
  .player select{width:72px;flex:0 0 72px;border:1px solid var(--line);border-radius:7px;padding:var(--space-1) var(--space-1);font:inherit;background:var(--color-surface);color:var(--ink)}
  .player input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:var(--space-1) var(--space-2);font:inherit}
  .actions{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
  .btn{border:1px solid var(--line);background:var(--color-surface);border-radius:9px;padding:var(--space-2) var(--space-3);cursor:pointer;font:inherit}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:var(--color-surface)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;box-shadow:0 0 0 3px var(--color-shadow-blue-14)}
  .action-status{min-height:1.5em}
  .action-status.error{color:var(--color-negative)}
  .preview{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
  canvas{width:100%;max-width:1120px;height:auto;border-radius:12px;box-shadow:0 18px 50px var(--color-backdrop-subtle);background:var(--color-inverse)}
  .hint{color:var(--sub);font-size:12px}
  .art-preview{max-width:100%;max-height:90px;border-radius:8px;display:none;margin-top:var(--space-1)}
  body{-webkit-font-smoothing:antialiased}
  .wrap{max-width:1640px;padding:var(--space-5) clamp(var(--space-3),2.3vw,var(--space-8)) var(--space-11)}
  header{margin-bottom:var(--space-3)}
  h1{font-size:26px;letter-spacing:-.02em}
  .sub{max-width:850px;line-height:1.7}
  .layout{grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:var(--space-4);align-items:start;margin-top:0}
  .panel{border-radius:14px;box-shadow:0 2px 8px var(--color-shadow-ink-045),0 12px 28px var(--color-shadow-ink-035)}
  .form{border-top:3px solid var(--blue)}
  .form h3{display:flex;align-items:center;gap:var(--space-2)}
  .team-box{padding:var(--space-3);border-radius:11px;background:linear-gradient(180deg,var(--color-surface),var(--color-surface-raised))}
  .team-box h4{display:flex;align-items:center;gap:var(--space-2)}
  .team-box h4:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .row input,.row select,.player input,.player select{min-height:36px}
  .actions{position:sticky;bottom:0;padding:var(--space-2) 0 2px;background:var(--color-white-94);backdrop-filter:blur(8px);z-index:2}
  .actions .btn{min-height:38px}
  .preview{position:sticky;top:16px;min-height:420px;justify-content:center;background:radial-gradient(ellipse at 50% 35%,var(--color-surface) 0%,var(--color-surface-raised) 70%)}
  .preview canvas{aspect-ratio:16/9;max-width:1120px;border:1px solid var(--color-shadow-gold-22)}
  .preview canvas{max-height:calc(100vh - 110px);object-fit:contain}
  @media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.preview{position:static;min-height:0}.preview canvas{max-height:none}}
  @media(max-width:600px){.wrap{padding:var(--space-3) var(--space-3) var(--space-7)}.panel{padding:var(--space-3)}.row{align-items:stretch;flex-wrap:wrap}.row label{width:100%;flex-basis:100%}.actions{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>赛前宣传图</h1>
    <div class="sub">赛事横版主视觉 · 1920×1080（16:9），适合直播预告与横屏发布。可叠加一张额外美术素材。</div>
  </header>
  <div class="layout">
    <section class="panel form">
      <h2>比赛信息</h2>
      <div class="row"><label for="pEvent">赛事</label><input id="pEvent" value="2026PKC秋季赛"></div>
      <div class="row"><label for="pStage">阶段</label><input id="pStage" value="16进8"></div>
      <div class="row"><label for="pDate">日期</label><input id="pDate" value="10月20日"></div>
      <div class="row"><label for="pTime">时间</label><input id="pTime" value="20:00"></div>
      <div class="row"><label for="pBo">赛制</label><select id="pBo"><option>BO3</option><option selected>BO5</option><option>BO7</option></select></div>
      <div class="row"><label for="pSub">副标题</label><input id="pSub" placeholder="如：胜者晋级八强"></div>
      <div class="row"><label for="pFooter">底部</label><input id="pFooter" placeholder="如：直播间 / 观赛群"></div>
      <div class="caster-box">
        <b>解说席（可填 1 至 3 人）</b>
        <div class="caster-grid">
          <input id="pCaster1" maxlength="32" aria-label="解说 1" placeholder="解说 1">
          <input id="pCaster2" maxlength="32" aria-label="解说 2" placeholder="解说 2">
          <input id="pCaster3" maxlength="32" aria-label="解说 3" placeholder="解说 3">
        </div>
      </div>

      <div class="team-box">
        <h3>左队</h3>
        <div class="row"><label for="pTeamLeft">队名</label><input id="pTeamLeft" list="pTeamNames" placeholder="搜索或输入队名"></div>
        <div id="pPlayersLeft"></div>
        <details class="optional-sub" id="pSubOptionsLeft"><summary id="pSubLeftSummary">添加替补选手（可选）</summary>
          <div class="row"><label for="pSubLeft">替补选手</label><input id="pSubLeft" list="pSubsLeft" placeholder="搜索或输入替补选手"><select id="pSubLaneLeft" aria-label="左队替补主选分路"><option value="">主选分路</option><option>上单</option><option>对抗路</option><option>打野</option><option>中路</option><option>发育路</option><option>游走</option><option>补位</option></select></div>
          <div class="row"><label for="pSubHeroLeft">代表英雄</label><input class="hero-name" id="pSubHeroLeft" list="heroNames" placeholder="搜索或手填代表英雄"></div>
        </details>
        <datalist id="pSubsLeft"></datalist>
      </div>
      <div class="team-box">
        <h3>右队</h3>
        <div class="row"><label for="pTeamRight">队名</label><input id="pTeamRight" list="pTeamNames" placeholder="搜索或输入队名"></div>
        <div id="pPlayersRight"></div>
        <details class="optional-sub" id="pSubOptionsRight"><summary id="pSubRightSummary">添加替补选手（可选）</summary>
          <div class="row"><label for="pSubRight">替补选手</label><input id="pSubRight" list="pSubsRight" placeholder="搜索或输入替补选手"><select id="pSubLaneRight" aria-label="右队替补主选分路"><option value="">主选分路</option><option>上单</option><option>对抗路</option><option>打野</option><option>中路</option><option>发育路</option><option>游走</option><option>补位</option></select></div>
          <div class="row"><label for="pSubHeroRight">代表英雄</label><input class="hero-name" id="pSubHeroRight" list="heroNames" placeholder="搜索或手填代表英雄"></div>
        </details>
        <datalist id="pSubsRight"></datalist>
      </div>

      <details class="optional-section"><summary>额外美术素材（可选）</summary>
        <div class="optional-content">
          <div class="row"><label for="pArt">图片</label><input id="pArt" type="file" accept="image/png,image/jpeg,image/webp"></div>
          <div class="row"><label for="pArtOpacity">透明度</label><input id="pArtOpacity" type="range" min="0" max="100" value="55"></div>
          <img class="art-preview" id="pArtPreview" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="">
          <div class="hint">建议透明背景 PNG，会居中叠在对阵卡片之间；不选则只出面板。</div>
        </div>
      </details>

      <div class="actions">
        <button class="btn primary" id="btnDraw">生成预览</button>
        <button class="btn" id="btnDownload">下载 PNG</button>
      </div>
      <div class="hint action-status" id="pActionStatus" role="status" aria-live="polite" aria-atomic="true"></div>
      <datalist id="pTeamNames"></datalist>
      <datalist id="heroNames"></datalist>
    </section>

    <section class="panel preview">
      <canvas id="poster" width="1920" height="1080" aria-label="16:9 赛前宣传图预览"></canvas>
      <div class="hint" id="pMsg">选队后会自动带出队伍库里的 5 名选手，也可以手动改。</div>
      <h2>选手宣传轮播 · 直播画面</h2>
      <canvas id="spotlightPreview" width="1920" height="1080" aria-label="宣传轮播直播画面"></canvas>
      <div class="row" style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" id="spotlightPush">推送并切到直播</button><button class="btn" id="spotlightPrev">上一位</button><button class="btn" id="spotlightToggle">开始轮播</button><button class="btn" id="spotlightNext">下一位</button><button class="btn" id="spotlightExport">导出当前轮播画面 PNG</button><select id="spotlightInterval"><option value="5000">5 秒</option><option value="8000" selected>8 秒</option><option value="10000">10 秒</option><option value="15000">15 秒</option><option value="30000">30 秒</option></select></div>
    </section>
  </div>
</div>
<script src="/assets/pkc-spotlight.js"></script><script src="/assets/pkc-promo.js"></script>
</body>
</html>
