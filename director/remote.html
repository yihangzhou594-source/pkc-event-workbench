<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b2d">
  <meta name="description" content="PKC 手机对局录入，上传赛后截图并核对识别数据。">
  <title>PKC 手机对局录入</title>
  <link rel="stylesheet" href="../assets/design-tokens.css" />
  <style>
    /* Hallmark · shape: app screen · genre: modern-minimal · scope: app · built: the project · redesign: polish · v2.0.0 */
    /* Hallmark · waive 7b · shared project palette uses white for controls and surfaces · preserve the existing semantic palette across tools */
    /* pre-emit critique: improve touch targets, upload review and contrast. */
    :root{
      --color-primary:#245bdf;--color-on-primary:#fbfcff;--color-surface:#fbfcff;--color-white:#fbfcff;--color-muted:#52647c;--ink:var(--color-ink);--sub:var(--color-muted);--line:var(--color-line);--card:var(--color-surface);
      --blue:var(--color-primary);--gold:var(--color-gold);--ok:var(--color-positive);--warn:var(--color-warning);
      --bad:var(--color-negative);--bg:var(--color-canvas);
    }
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;overflow-x:clip}
    body{font:15px/1.45 var(--font-body);color:var(--color-on-dark);background:var(--color-inverse)}
    button{font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--color-gold-bright);outline-offset:2px}
    .wrap{width:min(680px,100%);margin:0 auto;padding:max(var(--space-4),env(safe-area-inset-top)) var(--space-3) max(var(--space-6),env(safe-area-inset-bottom))}
    .brand{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-1) var(--space-1) var(--space-4);color:var(--color-on-dark)}
    .brand .mark{width:42px;height:42px;border-radius:13px;background:var(--color-primary);display:grid;place-items:center;font:900 15px/1 var(--font-data);color:var(--color-on-primary)}
    .brand b{display:block;font-size:17px}.brand span{display:block;font-size:12px;opacity:.65}
    .card{background:var(--color-white-96);border:1px solid var(--color-white-70);border-radius:18px;padding:var(--space-4);margin-bottom:var(--space-3)}
    .status{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;color:var(--color-on-dark);font-size:12px;margin:0 var(--space-1) var(--space-3)}
    .pill{padding:var(--space-1) var(--space-2);border-radius:999px;background:var(--color-white-16);border:1px solid var(--color-white-22)}
    .pill.on{background:var(--color-positive-soft);border-color:var(--color-positive-line);color:var(--color-positive-strong)}.pill.bad{background:var(--color-negative-soft);border-color:var(--color-negative-line);color:var(--color-negative-2)}
    .pair-card{max-width:430px;margin:10vh auto 0}.pair-card h1{font-size:23px;margin:var(--space-1) 0 var(--space-1)}.pair-card p{margin:0 0 var(--space-4);color:var(--sub)}
    label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:var(--space-3) 0 var(--space-1)}
    input{width:100%;border:1px solid var(--line);border-radius:12px;padding:var(--space-3) var(--space-4);font:inherit;background:var(--color-paper);color:var(--ink)}
    input:focus{outline:2px solid var(--color-focus);border-color:var(--blue)}
    .btn{width:100%;border:1px solid var(--line);border-radius:12px;padding:var(--space-3) var(--space-4);background:transparent;font-weight:800;cursor:pointer}
    .btn.primary{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
    .btn:disabled{opacity:.42;cursor:not-allowed}
    .message{min-height:18px;color:var(--sub);font-size:12px;text-align:center;margin-bottom:var(--space-2);opacity:.8}
    .hidden{display:none!important}
    .entry-head{display:flex;align-items:flex-start;gap:var(--space-2)}.entry-head h1{font-size:19px;margin:0}.entry-head p{color:var(--sub);font-size:12px;margin:var(--space-1) 0 0}
    .entry-step{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--color-primary-soft);color:var(--color-primary-dark);font-weight:900;flex:none}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}.field-grid.three{grid-template-columns:repeat(3,1fr)}
    select{width:100%;border:1px solid var(--line);border-radius:10px;padding:var(--space-3);background:var(--color-paper);font:inherit;color:var(--ink)}
    .target{border:1px solid var(--line);border-radius:12px;background:var(--color-surface-sunken);padding:var(--space-2);margin-top:var(--space-2);font-size:12px;color:var(--sub)}
    .target b{color:var(--ink)}.upload-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}.upload-actions .btn{position:relative;overflow:hidden}.upload-actions input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
    .file-list{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2);margin-top:var(--space-2)}.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--color-surface-sunken)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;right:3px;top:3px;width:22px;height:22px;border:0;border-radius:50%;background:var(--color-paper);color:var(--ink);font-size:14px;line-height:1;cursor:pointer}
    .entry-note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:var(--space-2)}.entry-status{font-size:12px;color:var(--sub);margin-top:var(--space-2);min-height:18px}.entry-status.bad{color:var(--bad)}
    .warn-box{padding:var(--space-2) var(--space-2);border-radius:10px;background:var(--color-warning-soft);color:var(--color-on-gold);font-size:12px;margin-top:var(--space-2)}.warn-box ul{margin:var(--space-1) 0 0;padding-left:var(--space-4)}
    .player-card{border:1px solid var(--line);border-radius:12px;background:var(--color-paper);margin-top:var(--space-2);overflow:hidden}.player-card summary{cursor:pointer;padding:var(--space-2) var(--space-3);font-weight:800;font-size:12px;display:flex;gap:var(--space-2);align-items:center}.player-card summary span{font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-body{padding:0 var(--space-2) var(--space-3)}.side-block{margin-top:var(--space-2);padding:var(--space-2);border-radius:10px;background:var(--color-surface-sunken)}.side-block.blue{border:1px solid var(--blue)}.side-block.red{border:1px solid var(--bad)}
    .mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2);margin-top:var(--space-2)}.mini-grid label{margin:0;font-size:12px}.mini-grid input{padding:var(--space-2);border-radius:8px;font-size:12px}.mini-grid .wide{grid-column:span 2}
    .save-bar{padding-top:var(--space-3)}

    /* Hallmark · mobile upload workbench · incumbent tokens · scope app */
    /* Critique: prioritize screenshot review and readable touch controls. */
    #dataPane .card{border-radius:14px;padding:var(--space-5) var(--space-4);margin-bottom:var(--space-5)}
    input,select,.mini-grid input{font-size:16px;min-height:48px;caret-color:var(--blue)}
    button,select{touch-action:manipulation}
    button:active:not(:disabled){transform:scale(.98)}
    button,input,select{scroll-margin-block:90px}
    select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    .upload-actions{gap:var(--space-3)}.upload-actions .btn{min-height:72px;display:grid;place-items:center}
    .file-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
    .thumb{aspect-ratio:2.15;border-radius:10px}.thumb img{object-fit:contain}
    .thumb button{width:44px;height:44px;border-radius:10px;font-size:24px}
    #remoteOcrBtn{margin-top:var(--space-4);min-height:54px;font-size:17px}
    .entry-status{font-size:14px;line-height:1.6;min-height:28px}
    .mini-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3) var(--space-2)}
    .mini-grid label{font-size:13px}.mini-grid .wide{grid-column:span 3}
    .player-body{display:block}.side-block{padding:var(--space-4) 0;border-radius:0;border:0;border-top:1px solid var(--line)}
    .player-card summary{min-height:64px;padding:var(--space-4);font-size:16px}
    .save-bar{position:sticky;bottom:0;padding:var(--space-3) 0 max(var(--space-3),env(safe-area-inset-bottom));background:var(--card)}
    .save-bar .btn{min-height:54px;font-size:16px}
    .field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    @media(max-width:360px){.field-grid.three{grid-template-columns:1fr}.mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mini-grid .wide{grid-column:span 2}}
    @media(prefers-reduced-motion:reduce){button:active:not(:disabled){transform:none}}

 input,select{border-color:var(--sub)}
 h1,h2{ text-wrap:balance; overflow-wrap:break-word; min-width:0 }
 .btn{background:transparent}
 .side-block.blue,.side-block.red{border:0;border-top:1px solid var(--line)}

 .card{color:var(--ink)}
 button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
 .entry-step{color:var(--color-primary-dark)}
    #dataPane .upload-actions{margin-bottom:var(--space-3)}
    #dataPane .entry-note{margin-bottom:var(--space-3)}
    #dataPane .btn,#dataPane select{min-height:44px}
    #dataPane .save-bar{position:static}
    #dataPane .save-bar .btn{width:100%}
    .upload-actions .btn:focus-within{outline:2px solid var(--color-primary);outline-offset:2px}
    .lane-overview{width:100%;table-layout:fixed;text-align:left;margin:var(--space-4) 0;border-collapse:collapse}
    .lane-overview caption{text-align:left;font-weight:700;margin-bottom:var(--space-2)}
    .lane-overview th:first-child{width:48px}
    .lane-overview th,.lane-overview td{padding:var(--space-1);border-bottom:1px solid var(--line)}
    .lane-overview label{margin:0}
    .lane-overview label span{display:block;overflow-wrap:anywhere}
    .save-feedback:empty{display:none}
    .save-feedback:not(:empty){background:var(--card);color:var(--ink);padding:var(--space-3);border-radius:8px}
    #remoteManual,#repairBtn{min-height:44px;margin-top:var(--space-2)}
    #repairBtn{color:var(--color-on-dark)}
</style>
<link rel="stylesheet" href="/assets/side-picker.css">
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="mark">PKC</div><div><b>手机对局录入</b><span>薄扶林王者杯</span></div></div>
    <div class="status"><span class="pill" id="conn">连接中</span><span class="pill" id="device">未配对</span><span class="pill" id="expiry">等待连接</span></div>

    <section class="card pair-card" id="pairView">
      <h1>连接导播电脑</h1>
      <p>输入电脑工作台显示的 6 位临时口令。云端模式可通过公网访问；局域网模式需与电脑处于同一网络。</p>
      <label for="pin">临时口令</label>
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000">
      <label for="deviceName">设备名称</label>
      <input id="deviceName" maxlength="20" placeholder="例如：导播 iPhone">
      <div style="height:12px"></div>
      <button class="btn primary" id="pairBtn">连接</button>
      <div class="message" id="pairMsg" role="status" aria-live="polite"></div>
    </section>

    <section id="controlView" class="hidden">
      <section id="dataPane">
        <section class="card">
          <div class="entry-head"><span class="entry-step">1</span><div><h1>选择目标局次</h1><p>只能写入当前系列赛已排好双方的淘汰赛场次</p></div></div>
          <div class="field-grid">
            <label for="remoteMatchSelect">赛程场次<select id="remoteMatchSelect"></select></label>
            <label for="remoteGameSelect">局次<select id="remoteGameSelect"></select></label>
          </div>
          <div class="target" id="remoteTarget">正在读取场次…</div>
          <button class="btn" id="remoteManual" type="button">手动录入</button>
        </section>
        <section class="card">
          <div class="entry-head"><span class="entry-step">2</span><div><h1>上传客户端截图</h1><p>最多 4 张；图片只在电脑内存中识别，不保存原图</p></div></div>
          <div class="upload-actions">
            <label class="btn primary">拍照<input id="remoteCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label>
            <label class="btn">从相册选择<input id="remoteGallery" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
          </div>
          <div class="file-list" id="remoteFiles"></div>
          <div class="entry-note">请使用客户端原始「战绩」和「数据」截图，避免聊天软件压缩影响识别</div>
          <button class="btn primary" id="remoteOcrBtn" disabled>上传并识别</button>
          <div class="entry-status" id="remoteOcrStatus" role="status" aria-live="polite"></div>
        </section>
        <section class="card hidden" id="remoteReviewCard">
          <div class="entry-head"><span class="entry-step">3</span><div><h1>核对并保存</h1><p>所有格子都可修改；不完整数据可保存为草稿</p></div></div>
          <div class="field-grid three">
            <label>蓝方比分<input id="remoteBlueScore" inputmode="numeric"></label>
            <label>红方比分<input id="remoteRedScore" inputmode="numeric"></label>
            <label>对局时长<input id="remoteDuration" inputmode="text" placeholder="12:30"></label>
          </div>
          <div class="field-grid">
            <label>胜方<select id="remoteResult"><option value="win">蓝方获胜</option><option value="lose">红方获胜</option></select></label>
            <label>识别目标<div class="target" id="remoteTargetSummary" style="margin:3px 0 0"></div></label>
          </div>
          <div id="remoteWarnings"></div>
          <div id="remoteLanes"></div>
          <div id="remotePlayerCards"></div>
          <div class="save-bar"><button class="btn primary" id="remoteSaveBtn">确认保存到电脑</button></div>
        </section>
        <div class="entry-status save-feedback" id="remoteSaveStatus" role="status" aria-live="polite"></div>
      </section>
      <button class="btn" id="repairBtn" type="button">重新配对</button>
    </section>
  </main>
<script src="/assets/side-picker.js"></script>
  <script>
  (() => {
    "use strict";
    let state = null;
    let csrf = sessionStorage.getItem("pkcRemoteCsrf") || "";

    let online = false;
    let syncing = false;



    let matchCatalog = null;
    let selectedMatch = null;
    let selectedGame = "";
    let uploadFiles = [];
    let draft = null;
    let reviewTarget = null;
    let ocrBusy = false;
    let saving = false;
    const lanes = ["上单","打野","中路","发育路","游走"];
    const draftKey = "pkcRemoteEntryDraft";
    function persistDraft() {
      if (!draft || !selectedMatch || !matchCatalog) return;
      try {
        localStorage.setItem(draftKey, JSON.stringify({
          seriesId:matchCatalog.seriesId, matchKey:selectedMatch.matchKey, gameId:selectedGame, draft, reviewTarget,
        }));
      } catch {}
    }
    function restoreDraft() {
      if (draft) return;
      try {
        const saved = JSON.parse(localStorage.getItem(draftKey));
        if (saved?.seriesId !== matchCatalog.seriesId) return;
        const match = matchCatalog.matches.find(item => item.matchKey === saved.matchKey);
        if (!match || (saved.gameId && !match.games.some(game => game.id === saved.gameId))) return;
        selectedMatch = match;
        selectedGame = saved.gameId;
        draft = saved.draft;
        reviewTarget = saved.reviewTarget;
        renderReview();
      } catch {}
    }
    const $ = (id) => document.getElementById(id);

    const escHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;",
    }[char]));

    const setConnected = (value, text) => {
      online = value;
      $("conn").classList.toggle("on", value);
      $("conn").classList.toggle("bad", !value);
      $("conn").textContent = text || (value ? "已连接" : "连接中断");
      renderGameSelect();
    };

    async function request(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (csrf) headers["X-PKC-CSRF"] = csrf;
      if (options.body) headers["Content-Type"] = "application/json";
      const response = await fetch(url, { cache:"no-store", ...options, headers });
      const result = await response.json().catch(() => ({}));
      return { ok:response.ok, status:response.status, result };
    }

    async function pair() {
      const pin = $("pin").value.replace(/\D/g, "").slice(0, 6);
      const deviceName = $("deviceName").value.trim() || "手机录入";
      if (pin.length !== 6) { $("pairMsg").textContent = "请输入 6 位口令"; return; }
      $("pairBtn").disabled = true;
      $("pairMsg").textContent = "正在连接…";
      const { ok, result } = await request("/api/remote/pair", {
        method:"POST", body:JSON.stringify({ pin, deviceName }),
      });
      $("pairBtn").disabled = false;
      if (!ok) {
        const wait = result.retryAfterMs ? "（约 " + Math.ceil(result.retryAfterMs / 1000) + " 秒后）" : "";
        $("pairMsg").textContent = (result.message || "连接失败") + wait;
        return;
      }
      csrf = result.csrf;
      sessionStorage.setItem("pkcRemoteCsrf", csrf);
      $("pairView").classList.add("hidden");
      $("controlView").classList.remove("hidden");
      $("device").textContent = result.deviceName;
      await loadState();
    }

    async function loadState() {
      if (syncing) return;
      syncing = true;
      try {
        const { ok, status, result } = await request("/api/remote/state");
        if (status === 401) return showPair();
        if (!ok) throw new Error(result.message || result.error || "状态读取失败");
        state = result;
        if (state.remote?.csrf) {
          csrf = state.remote.csrf;
          sessionStorage.setItem("pkcRemoteCsrf", csrf);
        }
        $("pairView").classList.add("hidden");
        $("controlView").classList.remove("hidden");
        $("device").textContent = state.remote?.deviceName || "已配对";
        setConnected(true, "已连接");
        await loadMatchCatalog(!draft && !saving && !ocrBusy);
      } catch (error) {
        setConnected(false, "连接中断");
        dataStatus(error.message, true);
      } finally {
        syncing = false;
      }
    }

    function showPair() {
      sessionStorage.removeItem("pkcRemoteCsrf");
      csrf = "";
      state = null;
      $("controlView").classList.add("hidden");
      $("pairView").classList.remove("hidden");
      $("device").textContent = "未配对";
      setConnected(false, "未连接");
    }
    async function repair() {
      try {
        if (csrf) await request("/api/remote/logout", { method:"POST", body:"{}" });
      } catch {}
      showPair();
      $("pin").focus();
    }

    function dataStatus(text, bad = false) {
      $("remoteOcrStatus").textContent = text || "";
      $("remoteOcrStatus").classList.toggle("bad", !!bad);
    }

    async function loadMatchCatalog(force = false) {
      if (!state) return;
      if (matchCatalog && !force) {
        renderMatchCatalog();
        return;
      }
      dataStatus("正在读取场次…");
      const { ok, status, result } = await request("/api/remote/match-context");
      if (status === 401) return showPair();
      if (!ok) {
        dataStatus(result.message || "无法读取场次", true);
        return;
      }
      if (matchCatalog && matchCatalog.seriesId === result.seriesId
        && matchCatalog.matchesRevision === result.matchesRevision
        && matchCatalog.contextRevision === result.contextRevision) return;
      matchCatalog = result;
      const previous = selectedMatch?.matchKey;
      selectedMatch = result.matches.find((match) => match.matchKey === previous)
        || result.matches.find((match) => match.matchKey === result.selectedMatchKey)
        || result.matches[0]
        || null;
      if (!previous && !selectedGame && selectedMatch?.matchKey === result.currentMatchKey && result.currentGameId) {
        selectedGame = result.currentGameId;
      }
      selectedGame = selectedMatch?.games.some((game) => game.id === selectedGame) ? selectedGame : "";
      restoreDraft();
      renderMatchCatalog();
      dataStatus(matchCatalog.matches.length ? "" : "当前系列赛还没有双方队伍已排定的淘汰赛场次", !matchCatalog.matches.length);
    }

    function resetReview() {
      try { localStorage.removeItem(draftKey); } catch {}
      draft = null;
      reviewTarget = null;
      $("remoteReviewCard").classList.add("hidden");
      $("remoteSaveStatus").textContent = "";
    }

    function renderMatchCatalog() {
      const matchSelect = $("remoteMatchSelect");
      matchSelect.innerHTML = (matchCatalog?.matches || []).map((match) =>
        `<option value="${escHtml(match.matchKey)}">${escHtml(match.roundLabel)} · ${escHtml(match.label)}</option>`
      ).join("");
      if (selectedMatch) matchSelect.value = selectedMatch.matchKey;
      renderGameSelect();
    }

    function renderGameSelect() {
      const select = $("remoteGameSelect");
      select.innerHTML = "";
      if (!selectedMatch) {
        select.innerHTML = '<option value="">暂无场次</option>';
        $("remoteTarget").textContent = "请先在电脑的淘汰赛赛程中排定双方队伍。";
        $("remoteOcrBtn").disabled = true;
        $("remoteManual").disabled = true;
        return;
      }
      selectedMatch.games.forEach((game) => {
        select.append(new Option(game.label + (game.score?.join(":") ? " · " + game.score.join(":") : ""), game.id));
      });
      select.append(new Option("＋ 新建 " + selectedMatch.nextGameLabel, "__new__"));
      if (!selectedGame || !selectedMatch.games.some((game) => game.id === selectedGame)) selectedGame = "";
      select.value = selectedGame || "__new__";
      $("remoteTarget").innerHTML = `<b>${escHtml(selectedMatch.blueName)} vs ${escHtml(selectedMatch.redName)}</b><br>`
        + `${escHtml(selectedMatch.roundLabel)} · ${selectedGame
          ? "覆盖 " + escHtml(selectedMatch.games.find((game) => game.id === selectedGame)?.label || "")
          : "新建 " + escHtml(selectedMatch.nextGameLabel)}`;
      $("remoteOcrBtn").disabled = !online || !uploadFiles.length || ocrBusy;
      $("remoteManual").hidden = !!selectedGame;
      $("remoteManual").disabled = !online || ocrBusy || saving;
    }

    async function compressImage(file) {
      if (!/^image\/(?:jpeg|png|webp)$/i.test(file.type)) throw new Error("只支持 JPG、PNG、WebP");
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 2560 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close?.();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", .9));
      if (!blob) throw new Error("图片压缩失败");
      return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type:"image/jpeg" });
    }

    async function addFiles(fileList) {
      const incoming = Array.from(fileList || []);
      if (!incoming.length) return;
      if (uploadFiles.length + incoming.length > 4) {
        dataStatus("最多上传 4 张截图", true);
        return;
      }
      dataStatus("正在压缩图片…");
      try {
        for (const file of incoming) uploadFiles.push(await compressImage(file));
        renderFiles();
        dataStatus("图片已准备，可以开始识别");
      } catch (error) {
        dataStatus(error.message, true);
      }
    }

    function renderFiles() {
      const host = $("remoteFiles");
      for (const item of host.querySelectorAll("img[data-object-url]")) URL.revokeObjectURL(item.dataset.objectUrl);
      host.replaceChildren();
      uploadFiles.forEach((file, index) => {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const img = document.createElement("img");
        img.dataset.objectUrl = URL.createObjectURL(file);
        img.src = img.dataset.objectUrl;
        img.alt = "截图 " + (index + 1);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "移除第 " + (index + 1) + " 张");
        remove.onclick = () => {
          uploadFiles.splice(index, 1);
          renderFiles();
          renderGameSelect();
        };
        thumb.append(img, remove);
        host.append(thumb);
      });
      $("remoteOcrBtn").disabled = !online || !uploadFiles.length || ocrBusy || !selectedMatch;
    }

    function fileDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("读取图片失败"));
        reader.readAsDataURL(file);
      });
    }

    async function startOcr() {
      if (ocrBusy || !uploadFiles.length || !selectedMatch) return;
      let blueId = "";
      if (!selectedMatch.games.length) {
        const match = selectedMatch;
        const gameId = selectedGame;
        const choice = await chooseFirstGameBlue(match.blueName, match.redName);
        if (choice === null || selectedMatch !== match || selectedGame !== gameId || ocrBusy) return;
        blueId = choice === 0 ? match.blueId : match.redId;
      }
      const files = [...uploadFiles];
      ocrBusy = true;
      $("remoteMatchSelect").disabled = $("remoteGameSelect").disabled = true;
      $("remoteOcrBtn").textContent = "正在识别，请稍候…";
      renderFiles();
      dataStatus("正在上传到电脑…");
      try {
        const images = await Promise.all(files.map(fileDataUrl));
        dataStatus("电脑正在识别，请稍候…");
        const { ok, status, result } = await request("/api/remote/ocr-draft", {
          method:"POST",
          body:JSON.stringify({
            matchKey:selectedMatch.matchKey,
            gameId:selectedGame || null,
            blueId,
            images,
          }),
        });
        if (status === 401) return showPair();
        if (!ok) throw new Error(result.message || result.error || "识别失败");
        draft = result.draft;
        reviewTarget = result.target;
        uploadFiles = uploadFiles.filter(file => !files.includes(file));
        persistDraft();
        renderReview();
        dataStatus("识别完成，请逐项核对后保存");
      } catch (error) {
        dataStatus(error.message, true);
      } finally {
        ocrBusy = false;
        $("remoteMatchSelect").disabled = $("remoteGameSelect").disabled = false;
        $("remoteOcrBtn").textContent = "重新识别截图";
        renderFiles();
      }
    }

    const SIDE_FIELDS = [
      ["name", "选手"], ["hero", "英雄"], ["k", "击杀"], ["d", "死亡"], ["a", "助攻"],
      ["rating", "局内评分"], ["tankRaw", "总承伤"], ["gold", "总经济"], ["dmgPct", "输出%"], ["tankPct", "承伤%"],
      ["goldShare", "经济%"], ["kp", "参团%"], ["dmgWan", "输出(万)"],
    ];

    function sideEditor(side, label, row, index) {
      return `<div class="side-block ${side === "our" ? "blue" : "red"}">
        <strong>${label}</strong>
        <div class="mini-grid">${SIDE_FIELDS.map(([field, title]) =>
          `<label class="${field === "name" || field === "hero" ? "wide" : ""}">${title}<input data-side="${side}" data-row="${index}" data-field="${field}" value="${escHtml(row[side]?.[field] || "")}" ${["k","d","a","gold","dmgPct","tankPct","goldShare","kp","dmgWan"].includes(field) ? 'inputmode="decimal"' : ""}></label>`
        ).join("")}</div></div>`;
    }

    function basicMissing() {
      if (!draft) return [];
      const missing = [];
      for (const [side, label] of [["our", "蓝方"], ["opp", "红方"]]) {
        draft.rows.forEach((row, index) => {
          if (!row[side === "our" ? "pos" : "posOpp"]) missing.push(label + "第" + (index + 1) + "行分路待确认");
          if (!String(row[side]?.name || "").trim()) missing.push(label + "第" + (index + 1) + "行缺选手");
          if (!String(row[side]?.hero || "").trim()) missing.push(label + "第" + (index + 1) + "行缺英雄");
        });
      }
      return missing;
    }

    function renderWarnings() {
      const missing = basicMissing();
      const warnings = draft?.warnings || [];
      const host = $("remoteWarnings");
      if (!missing.length && !warnings.length) {
        host.innerHTML = '<div class="warn-box"><b>字段完整</b> · 保存后仍建议在电脑端快速复核。</div>';
        return;
      }
      host.innerHTML = '<div class="warn-box"><b>保存前请检查</b><ul>'
        + missing.slice(0, 8).map((item) => "<li>" + escHtml(item) + "</li>").join("")
        + warnings.slice(0, 8).map((item) => "<li>" + escHtml(item) + "</li>").join("")
        + "</ul>" + (missing.length + warnings.length > 8 ? "<div>还有更多提示，保存后可在电脑端继续修正。</div>" : "") + "</div>";
    }

    function renderReview() {
      if (!draft) return;
      $("remoteReviewCard").classList.remove("hidden");
      $("remoteBlueScore").value = draft.blueScore ?? "";
      $("remoteRedScore").value = draft.redScore ?? "";
      $("remoteDuration").value = draft.duration ?? "";
      $("remoteResult").value = draft.result === "lose" ? "lose" : "win";
      $("remoteTargetSummary").textContent =
        (selectedMatch?.label || "") + " · " + (reviewTarget?.gameLabel || selectedMatch?.nextGameLabel || "");
      $("remotePlayerCards").innerHTML = draft.rows.map((row, index) =>
        `<details class="player-card"${index === 0 ? " open" : ""}><summary>第 ${index + 1} 组对位
          <span>${escHtml(row.our?.name || "蓝方待填")} vs ${escHtml(row.opp?.name || "红方待填")}</span></summary>
          <div class="player-body">${sideEditor("our", "蓝方", row, index)}${sideEditor("opp", "红方", row, index)}</div>
        </details>`
      ).join("");
      for (const input of $("remotePlayerCards").querySelectorAll("[data-field]")) {
        input.addEventListener("input", () => {
          const row = draft.rows[Number(input.dataset.row)];
          if (row?.[input.dataset.side]) row[input.dataset.side][input.dataset.field] = input.value.trim();
          const name = $("remoteLanes").querySelector(`[data-lane-player="${input.dataset.side}-${input.dataset.row}"]`);
          if (name) name.textContent = row[input.dataset.side].name || row[input.dataset.side].hero || (input.dataset.side === "our" ? "蓝方" : "红方");
          renderWarnings();
        });
      }
      $("remoteLanes").innerHTML = '<table class="lane-overview"><caption>分路一览</caption><thead><tr><th scope="col">对位</th><th scope="col">蓝方</th><th scope="col">红方</th></tr></thead><tbody>'
        + draft.rows.map((row, index) => '<tr><th scope="row">' + (index + 1) + '</th>'
          + [["our","蓝方","pos"],["opp","红方","posOpp"]].map(([side,label,key]) =>
            `<td><label><span data-lane-player="${side}-${index}">${escHtml(row[side]?.name || row[side]?.hero || label)}</span><select aria-label="${label}第 ${index + 1} 位分路" data-lane="${side}" data-row="${index}"><option value="">待确认</option>${lanes.map(lane => `<option${row[key] === lane ? " selected" : ""}>${lane}</option>`).join("")}</select></label></td>`).join("")
          + '</tr>').join("") + '</tbody></table>';
      for (const select of $("remoteLanes").querySelectorAll("[data-lane]")) {
        select.addEventListener("change", () => {
          const row = draft.rows[Number(select.dataset.row)];
          if (select.dataset.lane === "our") row.pos = select.value;
          else row.posOpp = select.value;
          renderWarnings();
        });
      }
      renderWarnings();
    }

    async function saveRemoteData() {
      if (!draft || saving) return;
      if (["pos","posOpp"].some(key => new Set(draft.rows.map(row => row[key]).filter(Boolean)).size !== lanes.length)) { $("remoteSaveStatus").textContent = "请为每一方分别设置五条不同的分路"; return; }
      const gameLabel = reviewTarget?.gameLabel || selectedMatch?.nextGameLabel || "新局";
      if (!confirm("保存到「" + selectedMatch.label + " · " + gameLabel + "」？\n"
        + (selectedGame ? "将覆盖该局原有玩法数据。" : "将新建这一局。"))) return;
      saving = true;
      $("remoteSaveBtn").disabled = true;
      $("remoteMatchSelect").disabled = $("remoteGameSelect").disabled = true;
      $("remoteSaveStatus").textContent = "正在保存到电脑…";
      try {
        const { ok, status, result } = await request("/api/remote/match-data", {
          method:"POST",
          body:JSON.stringify({
            seriesId:matchCatalog.seriesId,
            matchKey:selectedMatch.matchKey,
            gameId:selectedGame || null,
            overwriteLatest:true,
            baseRev:matchCatalog.matchesRevision,
            contextRevision:matchCatalog.contextRevision,
            draft,
          }),
        });
        if (status === 401) return showPair();
        if (!ok) throw new Error(result.message || result.error || "保存失败");
        $("remoteSaveStatus").textContent = "已保存 " + result.game.label + " · 缺失 " + result.missing.length
          + " 项，电脑端会自动同步";
        try { localStorage.removeItem(draftKey); } catch {}
        draft = null;
        reviewTarget = null;
        $("remoteReviewCard").classList.add("hidden");
        selectedGame = result.game.id;
        await loadMatchCatalog(true).catch(() => dataStatus("已保存，暂时无法更新小局列表", true));
      } catch (error) {
        $("remoteSaveStatus").textContent = error.message;
      } finally {
        saving = false;
        $("remoteSaveBtn").disabled = false;
        $("remoteMatchSelect").disabled = $("remoteGameSelect").disabled = false;
      }
    }

    $("pairBtn").onclick = pair;
    $("remoteMatchSelect").onchange = () => {
      selectedMatch = matchCatalog?.matches.find((match) => match.matchKey === $("remoteMatchSelect").value) || null;
      selectedGame = selectedMatch?.matchKey === matchCatalog?.currentMatchKey ? matchCatalog?.currentGameId || "" : "";
      resetReview();
      renderGameSelect();
    };
    $("remoteGameSelect").onchange = () => {
      selectedGame = $("remoteGameSelect").value === "__new__" ? "" : $("remoteGameSelect").value;
      resetReview();
      renderGameSelect();
    };
    ["remoteCamera","remoteGallery"].forEach((id) => {
      $(id).addEventListener("change", (event) => {
        addFiles(event.target.files);
        event.target.value = "";
      });
    });
    $("remoteOcrBtn").onclick = startOcr;
    $("remoteManual").onclick = async () => {
      if (!selectedMatch || selectedGame || saving || ocrBusy) return;
      if (draft) { $("remoteReviewCard").scrollIntoView({block:"start"}); return; }
      const match = selectedMatch;
      const gameId = selectedGame;
      let blueId = "";
      if (!match.games.length) {
        const choice = await chooseFirstGameBlue(match.blueName, match.redName);
        if (choice === null || selectedMatch !== match || selectedGame !== gameId) return;
        blueId = choice === 0 ? match.blueId : match.redId;
      }
      draft = {blueId, result:"win", rows:lanes.map(pos => ({pos, posOpp:pos, our:{}, opp:{}}))};
      reviewTarget = {gameLabel:match.games.find(game => game.id === gameId)?.label || match.nextGameLabel};
      persistDraft();
      renderReview();
    };
    $("remoteReviewCard").addEventListener("input", persistDraft);
    $("remoteReviewCard").addEventListener("change", persistDraft);
    $("remoteSaveBtn").onclick = saveRemoteData;
    $("remoteBlueScore").oninput = () => { if (draft) draft.blueScore = $("remoteBlueScore").value.trim(); renderWarnings(); };
    $("remoteRedScore").oninput = () => { if (draft) draft.redScore = $("remoteRedScore").value.trim(); renderWarnings(); };
    $("remoteDuration").oninput = () => { if (draft) draft.duration = $("remoteDuration").value.trim(); renderWarnings(); };
    $("remoteResult").onchange = () => { if (draft) draft.result = $("remoteResult").value; };
    $("pin").addEventListener("input", (event) => { event.target.value = event.target.value.replace(/\D/g, "").slice(0, 6); });
    $("pin").addEventListener("keydown", (event) => { if (event.key === "Enter") pair(); });
    window.addEventListener("offline", () => setConnected(false, "网络已断开"));
    window.addEventListener("online", () => loadState());

    $("repairBtn").onclick = repair;
    loadState();
    setInterval(() => {
      if (state) loadState();
    }, 15000);
  })();
  </script>
</body>
</html>
